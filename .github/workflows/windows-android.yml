name: Windows Android build

# Checks that an Android build on Windows records the commit (#176; see
# docs/decisions/build-info.md). Run by hand from the Actions tab rather
# than on every push.
on:
  workflow_dispatch:
  pull_request:  # TEMPORARY: first run in the #176 PR; removed before merge.

jobs:
  build-apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The pub cache goes on the checkout's drive (D:): Kotlin's
      # incremental compiler fails on plugin sources on another drive
      # ("this and base files have different roots").
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          pub-cache-path: D:\pub-cache

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build a debug APK
        run: flutter build apk --debug

      - name: Check the commit is in the APK
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          echo "HEAD is $sha"
          unzip -p build/app/outputs/flutter-apk/app-debug.apk 'classes*.dex' > dex.bin
          if grep -a -q "$sha" dex.bin; then
            echo "Found $sha in the APK."
          else
            echo "::error::The APK doesn't contain $sha."
            exit 1
          fi
