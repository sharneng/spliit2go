name: spliit2go
description: Unofficial, offline-capable Flutter client for Spliit.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # No explicit version range: flutter_localizations (an SDK
  # package) pins intl to an exact version tied to the installed
  # Flutter SDK release, and that pin varies across stable
  # versions/channels -- a caret range here (e.g. ^0.19.0) can
  # conflict with whatever this checkout's Flutter actually
  # requires. Letting pub resolve to flutter_localizations' own
  # constraint is the standard approach for this pairing.
  intl: any
  http: ^1.2.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  lucide_icons_flutter: ^3.1.20
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

flutter:
  assets:
    - assets/spliit-logo.png
  uses-material-design: true
  generate: true
